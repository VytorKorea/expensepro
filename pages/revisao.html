<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Revisar despesas | ExpensePro</title>
  <link rel="stylesheet" href="../css/revisao.css">
  <script src="../js/revisao.js" defer></script>
</head>
<body>
  <header>
    <h1>ExpensePro</h1>
    <h2>Revisar despesas</h2>
  </header>

  <main>
    <section>
      <h3>Despesas cadastradas</h3>

      <table>
        <thead>
          <tr>
            <th>Descrição</th>
            <th>Data</th>
            <th>Categoria</th>
            <th>Valor</th>
            <th>Ação</th>
          </tr>
        </thead>
        <tbody id="lista-despesas">
          <!-- O JavaScript vai colocar as despesas aqui -->
        </tbody>
      </table>
    </section>

    <section>
      <h3>Editar despesa</h3>

      <form id="form-edicao">
        <input id="despesa-id" type="hidden">

        <label for="descricao">Descrição</label>
        <input id="descricao" name="descricao" required>

        <label for="data">Data</label>
        <input id="data" name="data" type="date" required>

        <label for="categoria">Categoria</label>
        <select id="categoria" name="categoria" required>
          <option value="">Selecione</option>
          <option value="Transporte">Transporte</option>
          <option value="Hospedagem">Hospedagem</option>
          <option value="Alimentação">Alimentação</option>
          <option value="Materiais">Materiais</option>
        </select>

        <label for="valor">Valor em reais</label>
        <input id="valor" name="valor" type="number" min="0" step="0.01" required>

        <label for="observacao">Observação</label>
        <textarea id="observacao" name="observacao"></textarea>

        <button id="salvar-alteracoes" type="submit">Salvar alterações</button>
        <button id="excluir-despesa" type="button">Excluir despesa</button>
      </form>
    </section>
  </main>
</body>
</html>
