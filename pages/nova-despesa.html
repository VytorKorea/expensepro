<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nova despesa | ExpensePro</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/nova-despesa.css">
</head>
<body>
  <header class="topo">
    <a href="../index.html"><img class="logo" src="../img/logo.png" alt="ExpensePro"></a>
  </header>
  <main><section class="painel form-despesa">
    <h2>Cadastrar despesa</h2>
    <form id="form-despesa">
      <label for="descricao">Descrição</label><input id="descricao" name="descricao" required>
      <label for="valor">Valor (R$)</label><input id="valor" name="valor" type="number" min="0" step="0.01" required>
      <label for="data">Data</label><input id="data" name="data" type="date" required>
      <label for="categoria">Categoria</label>
      <select id="categoria" name="categoria" required>
        <option value="">Selecione</option><option>Transporte</option><option>Hospedagem</option><option>Alimentação</option><option>Materiais</option>
      </select>
      <label for="observacao">Observação</label><textarea id="observacao" name="observacao"></textarea>
      <p class="nota">O caso menciona o envio de fotos de notas fiscais.</p>
      <button type="submit">Salvar despesa</button>
    </form>
  </section></main>
  <script src="../js/nova-despesa.js"></script>
</body>
</html>
